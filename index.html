<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Important Question ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Customize Button -->
    <button id="customizeButton">
        ⚙️ Customize
    </button>


    <!-- Main Question -->
    <div class="container">

        <h1 id="question">
            Will you be my girlfriend? ❤️
        </h1>

        <div class="buttons">

            <button id="yesButton">
                Yes 🥰
            </button>

            <button id="noButton">
                No 😒
            </button>

        </div>

        <p id="message"></p>

    </div>


    <!-- Customize Menu -->
    <div id="customizeMenu">

        <div class="customize-box">

            <button id="closeCustomize">
                ✕
            </button>

            <h2>Customize ❤️</h2>

            <p>Choose a question:</p>

            <div class="preset-buttons">

                <button id="girlfriendPreset">
                    ❤️ Girlfriend
                </button>

                <button id="marriagePreset">
                    💍 Marriage
                </button>

                <button id="customPreset">
                    ✏️ Custom
                </button>

            </div>


            <!-- Custom Question Options -->
            <div id="customOptions">

                <label for="customQuestion">
                    Your Question:
                </label>

                <input
                    type="text"
                    id="customQuestion"
                    placeholder="Enter your question..."
                >

                <label for="customYes">
                    Yes Button:
                </label>

                <input
                    type="text"
                    id="customYes"
                    placeholder="Yes ❤️"
                >

                <label for="customNo">
                    No Button:
                </label>

                <input
                    type="text"
                    id="customNo"
                    placeholder="No 😒"
                >

                <button id="applyCustom">
                    Apply ❤️
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
